name: Apple Silicon macOS release acceptance (manual)

# Prepublication native evidence only. This never signs, publishes, or promotes OTA.
on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "Exact Studio draft/release tag (v0.88.0)"
        required: true
        type: string
      candidate_commit:
        description: "40-character source commit used to build all candidate assets"
        required: true
        type: string
      recovery_sha256:
        description: "SHA-256 of the reviewed macOS recovery ZIP"
        required: true
        type: string
      ota_sha256:
        description: "SHA-256 of the reviewed unsigned macOS OTA ZIP"
        required: true
        type: string

permissions:
  # GitHub draft releases require contents:write to be listed by GITHUB_TOKEN.
  # This manual acceptance job only issues GETs and performs no publication.
  contents: write

concurrency:
  group: macos-acceptance-${{ github.ref }}-${{ inputs.candidate_commit }}
  cancel-in-progress: false

jobs:
  native-apple-silicon:
    name: Native macOS 15 arm64 recovery, OTA and rollback
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CI: "true"
      KCS_NONINTERACTIVE: "1"
      KCS_OPEN_BROWSER: "false"
      ORT_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      STUDIO_CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      STUDIO_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      STUDIO_RECOVERY_SHA256: ${{ inputs.recovery_sha256 }}
      STUDIO_OTA_SHA256: ${{ inputs.ota_sha256 }}
    steps:
      - name: Check out read-only workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare reviewed native Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Prepare checksum-pinned native Python
        shell: bash
        env:
          STHANG_STUDIO_STATE_ROOT: ${{ runner.temp }}/sthang-acceptance-python-bootstrap
        run: |
          set -euo pipefail
          source scripts/macos-common.sh
          studio_macos_host
          if [[ "$STUDIO_MANAGED_PYTHON_VERSION" != "3.12.15" ||
                "$STUDIO_MANAGED_PYTHON_SHA256" != "316a463172740e71d8dca1f2730784e325f3f720941137b5d674d5801a632213" ]]; then
            echo "The reviewed Python bootstrap pin changed." >&2
            exit 1
          fi
          studio_macos_install_managed_python
          "$STUDIO_MANAGED_PYTHON_ROOT/bin/python3.12" -c 'import ensurepip, platform, ssl, sys, venv; assert platform.machine() == "arm64" and sys.version_info[:3] == (3, 12, 15)'
          printf '%s/bin\n' "$STUDIO_MANAGED_PYTHON_ROOT" >> "$GITHUB_PATH"

      - name: Check archive verifier's fail-closed cases
        shell: bash
        run: |
          python3 -B scripts/ci/macos-acceptance.py --self-test
          node scripts/ci/macos-ota-acceptance.mjs --self-test

      - name: Verify exact assets and exercise native Mac installer and installed OTA broker
        env:
          # The runner context is available here, after a native runner is assigned.
          STHANG_STUDIO_STATE_ROOT: ${{ runner.temp }}/sthang-studio-macos-native/state with spaces
          # contents:write permits authenticated GETs of draft releases; this
          # token is never passed to installed Studio or any runtime child.
          # No signing keys are provided to this job.
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 -B scripts/ci/macos-acceptance.py
