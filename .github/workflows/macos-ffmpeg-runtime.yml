name: Apple Silicon FFmpeg 8.1.3 provenance build

# Build evidence only. This workflow never updates runtime pins, signs a release,
# uploads to a public download origin, or promotes an OTA pointer.
on:
  workflow_dispatch:
  push:
    branches: [release/v0.86.0]
    paths:
      - .github/workflows/macos-ffmpeg-runtime.yml
      - scripts/ci/build-macos-ffmpeg.py
      - config/macos-ffmpeg-build-lock.json

permissions:
  contents: read

concurrency:
  group: macos-ffmpeg-source-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Pinned source to native arm64 FFmpeg and corresponding source
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CI: "true"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Check out exact read-only source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Select isolated native-build directory
        shell: bash
        run: |
          printf 'STUDIO_FFMPEG_WORK_DIR=%s/sthang-ffmpeg-8.1.3\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Provision exact reviewed native Python 3.12.15
        shell: bash
        run: |
          set -euo pipefail
          # The macos-15 arm64 Actions Python catalog does not provide 3.12.15.
          # Reuse Studio's committed, independently checksum-pinned native tool.
          source scripts/macos-managed-runtime.sh
          if [[ "$STUDIO_MANAGED_PYTHON_VERSION" != "3.12.15" ||
                "$STUDIO_MANAGED_PYTHON_RELEASE" != "20261003" ||
                "$STUDIO_MANAGED_PYTHON_SHA256" != "316a463172740e71d8dca1f2730784e325f3f720941137b5d674d5801a632213" ]]; then
            echo "Reviewed Studio Python source pin changed." >&2
            exit 1
          fi
          python_root="$RUNNER_TEMP/sthang-ffmpeg-python-3.12.15"
          if [[ -e "$python_root" ]]; then
            echo "Python bootstrap directory already exists; refusing to mix inputs." >&2
            exit 1
          fi
          mkdir -p "$python_root"
          archive="$python_root/$STUDIO_MANAGED_PYTHON_ARCHIVE"
          /usr/bin/curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 1800 --output "$archive" "$STUDIO_MANAGED_PYTHON_URL"
          actual="$(/usr/bin/shasum -a 256 "$archive")"
          if [[ "${actual%% *}" != "$STUDIO_MANAGED_PYTHON_SHA256" ]]; then
            echo "Reviewed Python archive failed checksum verification." >&2
            exit 1
          fi
          /usr/bin/tar -xzf "$archive" -C "$python_root"
          python_bin="$python_root/python/bin/python3.12"
          if [[ ! -x "$python_bin" ]]; then
            echo "Reviewed Python archive lacks a native executable." >&2
            exit 1
          fi
          "$python_bin" -c 'import platform, sys; assert platform.system() == "Darwin" and platform.machine() == "arm64"; assert sys.version_info[:3] == (3, 12, 15)'
          printf 'STUDIO_FFMPEG_PYTHON_BIN=%s\n' "$python_bin" >> "$GITHUB_ENV"
          printf 'STUDIO_FFMPEG_PYTHON_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"

      - name: Check immutable FFmpeg and third-party source pins
        shell: bash
        run: |
          "$STUDIO_FFMPEG_PYTHON_BIN" -B scripts/ci/build-macos-ffmpeg.py --validate-only

      - name: Compile static dependencies, verify native tools and assemble corresponding source
        shell: bash
        run: |
          "$STUDIO_FFMPEG_PYTHON_BIN" -B scripts/ci/build-macos-ffmpeg.py

      - name: Retain independently reviewable local build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-8.1.3-macos-arm64-provenance-${{ github.run_id }}
          path: ${{ runner.temp }}/sthang-ffmpeg-8.1.3/artifacts/
          if-no-files-found: error
          retention-days: 14
