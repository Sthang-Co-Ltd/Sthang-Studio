name: Apply bootstrap evidence documentation

on:
  push:
    branches:
      - chatgpt/ota-bootstrap-candidate-evidence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ota-bootstrap-candidate-evidence
          fetch-depth: 0

      - name: Document non-release CI evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ota = Path('docs/OTA-UPDATES.md')
          ota_text = ota.read_text(encoding='utf-8')
          ota_marker = '## Production/release gates\n'
          ota_section = '''## CI bootstrap evidence (not a release)\n\nWindows pull-request validation runs `npm run test:update-bootstrap`. The test creates an ephemeral Ed25519 pair only inside the runner's temporary directory, signs synthetic versioned metadata, stages a minimal dependency-changing package through the real update service, prepares it through the stable PowerShell broker, activates it through the stable launcher, validates the exact API/web version, preserves representative project/media/export/`.env`/protected-key markers, and exercises interrupted-activation recovery back to the prior version. The ephemeral private key and fixture installation are deleted before the runner completes.\n\nOn pushes to `main`, Windows CI also records exact SHA-256 and byte-size evidence for the ordinary Windows ZIP and unsigned OTA candidate, then retains those files for seven days as a GitHub Actions artifact for maintainer testing. `bootstrap-candidate-evidence.json` explicitly records `signed: false`, `published: false`, `promoted: false`, and `releaseEvidence: false`. The artifact is not a GitHub Release, public download, production signature, hosting proof, clean-machine result, or authority to advance `latest.json`.\n\nThis automation strengthens repeatable broker evidence but does not replace physical clean-Windows installation, real dependency/model preparation, power/process interruption tests, representative Khmer-to-CapCut regression, externally held production signing custody, or public endpoint verification.\n\n'''
          if ota_text.count(ota_marker) != 1:
              raise SystemExit('OTA production-gates marker was not found exactly once')
          ota.write_text(ota_text.replace(ota_marker, ota_section + ota_marker), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          changelog_text = changelog.read_text(encoding='utf-8')
          changelog_marker = '\n### Repository maintenance\n'
          changelog_section = '''\n### Updater bootstrap validation — not release evidence\n\n- Added a Windows integration test that uses an ephemeral, runner-local Ed25519\n  key and synthetic immutable versions to exercise signed check/download/staging,\n  dependency preparation, stable-launcher activation, exact-version health,\n  state preservation, and interrupted-activation rollback.\n- Added exact candidate byte/hash evidence and seven-day GitHub Actions retention\n  for the ordinary Windows package and unsigned OTA candidate on accepted `main`\n  pushes. The evidence explicitly marks the artifacts unsigned, unpublished,\n  unpromoted, and unsuitable as release proof.\n- No production trust root, private key, endpoint, release version, upload,\n  Cloudflare object, mutable pointer, public download, or product workflow changed.\n'''
          if changelog_text.count(changelog_marker) != 1:
              raise SystemExit('CHANGELOG repository-maintenance marker was not found exactly once')
          changelog.write_text(changelog_text.replace(changelog_marker, changelog_section + changelog_marker), encoding='utf-8')
          PY

          rm .github/workflows/apply-bootstrap-evidence-docs.yml
          git diff --check

      - name: Commit documentation and remove the temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/OTA-UPDATES.md .github/workflows/apply-bootstrap-evidence-docs.yml
          git commit -m "docs(updater): distinguish bootstrap CI evidence from releases"
          git push origin HEAD:chatgpt/ota-bootstrap-candidate-evidence
