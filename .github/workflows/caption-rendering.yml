name: Native captions and browser behavior

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: caption-rendering-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Caption rendering (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: ${{ runner.os == 'Windows' && 2 || 1 }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Install Linux native caption prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Prepare reviewed Windows FFmpeg without running the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Reuse the installer's exact pinned archive/hash, not a floating CI-only runtime.
          $installer = Get-Content scripts/install-new-pc.ps1 -Raw
          $section = [regex]::Match($installer, '(?s)function Install-FFmpegFallback \{(.*?)function Install-VCRuntimeFallback').Groups[1].Value
          $version = [regex]::Match($section, '\$version = ''([^'']+)''').Groups[1].Value
          $sha = [regex]::Match($section, '\$expectedSha256 = ''([a-f0-9]{64})''').Groups[1].Value
          if (-not $version -or -not $sha) { throw 'Reviewed FFmpeg pin could not be resolved' }
          $archive = Join-Path $env:RUNNER_TEMP 'caption-ffmpeg.zip'
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$version/ffmpeg-$version-essentials_build.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha) { throw 'FFmpeg checksum mismatch' }
          $root = Join-Path $env:RUNNER_TEMP 'caption-ffmpeg'
          Expand-Archive $archive $root
          $binary = Get-ChildItem $root -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $binary) { throw 'FFmpeg archive is missing its executable' }
          $binary.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Windows Khmer supplemental fonts for native rendering tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $regular = Join-Path $env:WINDIR 'Fonts\KhmerUI.ttf'
          $bold = Join-Path $env:WINDIR 'Fonts\KhmerUIB.ttf'
          if (-not (Test-Path $regular) -or -not (Test-Path $bold)) {
            $capability = 'Language.Fonts.Khmr~~~und-KHMR~0.0.1.0'
            $current = Get-WindowsCapability -Online -Name $capability
            if ($current.State -ne 'Installed') {
              Add-WindowsCapability -Online -Name $capability | Out-Null
            }
          }
          if (-not (Test-Path $regular) -or -not (Test-Path $bold)) {
            throw 'Windows Khmer Supplemental Fonts did not provide Khmer UI regular and bold faces.'
          }
      - name: Browser-compatible media preview tests
        run: npm run test:media-preview
      - name: Gate the one approved Windows diagnostic candidate
        id: preview-diagnostic-gate
        if: ${{ runner.os == 'Windows' && github.event_name == 'pull_request' && github.event.pull_request.number == 82 && github.run_attempt == 1 }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $line = git rev-list --parents -n 1 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify diagnostic candidate parent.' }
          $commits = $line.Trim() -split '\s+'
          if ($commits.Count -eq 2 -and $commits[1] -eq '7652c24966690da60004750acb5ae40846316ee6') {
            'enabled=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
      - name: Native rasterization, cancellation and real MP4 tests
        id: native-renderer
        env:
          STUDIO_NATIVE_PREVIEW_DIAGNOSTICS: ${{ steps.preview-diagnostic-gate.outputs.enabled == 'true' && format('{0}/native-preview-diagnostics', runner.temp) || '' }}
          STUDIO_NATIVE_PREVIEW_DIAGNOSTIC_PHASE: concurrent
        run: npm run test:caption-renderer
      # One diagnostic comparison, not a retry gate. The original step stays failed.
      - name: Isolated Windows persistent-preview diagnostic comparison
        if: ${{ !cancelled() && steps.preview-diagnostic-gate.outputs.enabled == 'true' && (steps.native-renderer.outcome == 'success' || steps.native-renderer.outcome == 'failure') }}
        env:
          STUDIO_NATIVE_PREVIEW_DIAGNOSTICS: ${{ runner.temp }}/native-preview-diagnostics
          STUDIO_NATIVE_PREVIEW_DIAGNOSTIC_PHASE: isolated
        run: node --import tsx --test tests/persistent-caption-preview.test.mts
      - name: Retain bounded synthetic Windows native diagnostics
        if: ${{ !cancelled() && steps.preview-diagnostic-gate.outputs.enabled == 'true' && (steps.native-renderer.outcome == 'success' || steps.native-renderer.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-preview-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-preview-diagnostics/*.json
          retention-days: 5
          if-no-files-found: error
      - name: Install isolated browser runtime
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Real app interaction and geometry tests
        if: runner.os == 'Linux'
        run: npm run test:browser
      - name: Retain synthetic browser evidence
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caption-browser-failures
          path: test-results/
          retention-days: 5
          if-no-files-found: ignore
