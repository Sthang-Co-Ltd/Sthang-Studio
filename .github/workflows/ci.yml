name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Public-readiness regression tests
        run: npm run test:public

      - name: Public-readiness guard
        run: npm run check:public

      - name: Install locked Node dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Updater tests
        run: npm run test:updater

      - name: Windows updater broker tests
        if: runner.os == 'Windows'
        run: npm run test:update-powershell

      - name: Ephemeral signed bootstrap integration
        if: runner.os == 'Windows'
        run: npm run test:update-bootstrap

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package Windows release candidate
        if: runner.os == 'Windows'
        run: npm run package:windows -- -SkipValidation

      - name: Package unsigned OTA candidate
        if: runner.os == 'Windows'
        run: npm run package:ota -- -SkipValidation

      - name: Record unsigned bootstrap candidate evidence
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run candidate:evidence

      - name: Upload unsigned bootstrap candidates for maintainer testing
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sthang-studio-unsigned-bootstrap-${{ github.sha }}
          path: |
            release-artifacts/Sthang-Studio-Windows-v*.zip
            release-artifacts/Sthang-Studio-Windows-v*.zip.sha256
            release-artifacts/Sthang-Studio-OTA-v*.zip
            release-artifacts/Sthang-Studio-OTA-v*.zip.sha256
            release-artifacts/Sthang-Studio-OTA-v*.release.unsigned.json
            release-artifacts/bootstrap-candidate-evidence.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check local timing worker syntax
        run: python -m py_compile local-timing/worker.py
