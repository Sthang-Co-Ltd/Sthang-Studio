name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Public-readiness regression tests
        run: npm run test:public

      - name: Public-readiness guard
        run: npm run check:public

      - name: Install locked Node dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Contribution privacy tests
        run: npm run test:contribution

      - name: Gemini request timeout tests
        run: npm run test:gemini

      - name: High-resolution media clock tests
        run: npm run test:media-clock

      - name: Project library tests
        run: npm run test:project-library

      - name: Project-loading benchmark source binding
        run: npm run test:project-loading-source-binding

      # The real Express export-admission regression probes an actual synthetic
      # MP4 and available Khmer caption fonts; it must not silently skip CI.
      # Keep these native prerequisites identical to caption-rendering.yml.
      - name: Install Linux native caption prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Prepare reviewed Windows FFmpeg without running the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Reuse the installer's exact pinned archive/hash, not a floating CI-only runtime.
          $installer = Get-Content scripts/install-new-pc.ps1 -Raw
          $section = [regex]::Match($installer, '(?s)function Install-FFmpegFallback \{(.*?)function Install-VCRuntimeFallback').Groups[1].Value
          $version = [regex]::Match($section, '\$version = ''([^'']+)''').Groups[1].Value
          $sha = [regex]::Match($section, '\$expectedSha256 = ''([a-f0-9]{64})''').Groups[1].Value
          if (-not $version -or -not $sha) { throw 'Reviewed FFmpeg pin could not be resolved' }
          $archive = Join-Path $env:RUNNER_TEMP 'caption-ffmpeg.zip'
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$version/ffmpeg-$version-essentials_build.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha) { throw 'FFmpeg checksum mismatch' }
          $root = Join-Path $env:RUNNER_TEMP 'caption-ffmpeg'
          Expand-Archive $archive $root
          $binary = Get-ChildItem $root -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $binary) { throw 'FFmpeg archive is missing its executable' }
          $binary.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Windows Khmer supplemental fonts for native rendering tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $regular = Join-Path $env:WINDIR 'Fonts\KhmerUI.ttf'
          $bold = Join-Path $env:WINDIR 'Fonts\KhmerUIB.ttf'
          if (-not (Test-Path $regular) -or -not (Test-Path $bold)) {
            $capability = 'Language.Fonts.Khmr~~~und-KHMR~0.0.1.0'
            $current = Get-WindowsCapability -Online -Name $capability
            if ($current.State -ne 'Installed') {
              Add-WindowsCapability -Online -Name $capability | Out-Null
            }
          }
          if (-not (Test-Path $regular) -or -not (Test-Path $bold)) {
            throw 'Windows Khmer Supplemental Fonts did not provide Khmer UI regular and bold faces.'
          }

      - name: Captioned video export tests
        run: npm run test:video-export

      - name: Updater tests
        run: npm run test:updater

      - name: Windows updater broker tests
        if: runner.os == 'Windows'
        run: npm run test:update-powershell

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package Windows release candidate
        if: runner.os == 'Windows'
        run: npm run package:windows -- -SkipValidation

      - name: Package unsigned OTA candidate
        if: runner.os == 'Windows'
        run: npm run package:ota -- -SkipValidation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check local timing worker syntax
        run: python -m py_compile local-timing/worker.py

      - name: Local timing cache and provisioning regressions
        run: npm run test:timing-dependencies
