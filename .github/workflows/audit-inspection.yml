name: Temporary audit source inspection

on:
  pull_request:
    paths:
      - '.github/workflows/audit-inspection.yml'

permissions:
  contents: read

jobs:
  source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chatgpt/slop-audit-caption-appearance'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact audit head with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Capture tracked-source evidence only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/studio-source-audit"
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/studio-source-audit/revision.txt"
          git ls-tree -r --long HEAD > "$RUNNER_TEMP/studio-source-audit/tree.txt"
          git bundle create "$RUNNER_TEMP/studio-source-audit/source.bundle" HEAD
          sha256sum "$RUNNER_TEMP/studio-source-audit/source.bundle" | tee "$RUNNER_TEMP/studio-source-audit/sha256.txt"
          cat "$RUNNER_TEMP/studio-source-audit/tree.txt"
      - name: Retain source audit transport (not a build or release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-source-audit-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/studio-source-audit/
          retention-days: 1
          if-no-files-found: error
