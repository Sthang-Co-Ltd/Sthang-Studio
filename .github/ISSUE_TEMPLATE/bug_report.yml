name: Bug report
description: Report a reproducible Sthang Studio problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Sthang Studio. Do not include API keys, private media, project exports, or other sensitive data. Security vulnerabilities belong in the private flow described in SECURITY.md.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: Tell us what you saw and what should have happened.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a minimal reproduction that does not expose private content.
      placeholder: |
        1. Open...
        2. Select...
        3. Click...
        4. Observe...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: App version, Git commit, or branch if known.
      placeholder: v0.7.11 or commit SHA

  - type: input
    id: windows
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2, etc.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Caption generation
        - Caption review/editing
        - Timing/waveform
        - Export/SRT
        - Projects/history/corrections
        - Setup/installation
        - UI/accessibility
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Safe logs or screenshots
      description: Remove API keys, personal media, paths/usernames, and private project content before attaching anything.

  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed API keys and private media/project data from this report.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
